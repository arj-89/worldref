<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wireframe: onboarding</title>
<!-- Stop 1 wireframe, greyscale, throwaway. Self-contained: no external requests. Strings parsed from WORDING.md; data from data/ in this repo; search and phone logic is dist/helpers.js inlined unchanged. -->
<style>*{box-sizing:border-box}
html,body{margin:0}
body{background:#b9b9b9;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#111}
/* wireframe tooling: visibly not part of the design */
#tools{position:fixed;inset-block-start:12px;inset-inline-start:12px;width:250px;max-height:calc(100vh - 24px);overflow:auto;background:#fff;border:2px dashed #555;padding:10px 12px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;z-index:10;direction:ltr;text-align:start}
#tools h2{font-size:12px;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
#tools h1{font-size:12px;margin:0 0 6px}
#tools button,#tools a.tl{display:inline-block;margin:2px 2px 0 0;padding:3px 6px;border:1px solid #777;background:#f2f2f2;font:inherit;color:#111;cursor:pointer;text-decoration:none}
#tools button[aria-pressed=true]{background:#111;color:#fff}
#tools button.na{border-style:dotted;color:#666}
#tools .taps{font-size:16px;font-weight:700}
#tools .note{color:#444;margin:4px 0}
#toolsToggle{display:none}
@media (max-width:960px){#tools{display:none}#tools.open{display:block}#toolsToggle{display:block;position:fixed;inset-block-end:10px;inset-inline-start:10px;z-index:11;font:12px ui-monospace,monospace;border:2px dashed #555;background:#fff;padding:6px 8px}}
/* the phone */
#device{position:relative;width:390px;height:844px;margin:24px auto;overflow:hidden;border:1px solid #6d6d6d;background:var(--bg);color:var(--fg)}
@media (min-width:961px){#device{margin-inline-start:max(290px,calc(50vw - 195px))}}
#scroller{height:100%;overflow-y:auto;overflow-x:hidden;scroll-padding-block-start:16px}
#overlay{position:absolute;inset:0;display:none;background:var(--bg);overflow-y:auto;z-index:5}
#overlay.on{display:block}
.wf{--bg:#f3f3f3;--fg:#141414;--mute:#555;--line:#bdbdbd;--box:#dedede;--box2:#e9e9e9;--panel:#fff;--inv:#141414;--invfg:#f3f3f3}
.wf[data-theme=dark]{--bg:#1b1b1b;--fg:#ededed;--mute:#ababab;--line:#4b4b4b;--box:#3a3a3a;--box2:#2c2c2c;--panel:#242424;--inv:#ededed;--invfg:#1b1b1b}
.wf a{color:inherit}
.wf :focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.wf button{font:inherit;color:inherit}
.pad{padding-inline:20px}
.skip{position:absolute;inset-inline-start:8px;inset-block-start:-40px}
.skip:focus{inset-block-start:8px;background:var(--panel);padding:8px;z-index:6}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;min-height:60px;border-block-end:1px solid var(--line)}
.wordmark{font-weight:700;font-size:17px;text-decoration:none;padding:10px 0;direction:ltr;unicode-bidi:isolate}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:0 16px;border:1px solid var(--fg);background:transparent;cursor:pointer;text-decoration:none;border-radius:8px;font-weight:600}
.btn.pri{background:var(--inv);color:var(--invfg);border-color:var(--inv)}
.btn.ghost{border-color:transparent}
.btn.sm{min-height:44px;padding:0 12px;font-size:14px}
.btn:active,.row:active,.chip:active,.seg button:active,.lnk:active{background:var(--box)}
.btn.pri:active{opacity:.75}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ic{display:inline-block;width:14px;height:14px;background:currentColor;opacity:.4;border-radius:2px;flex:none;vertical-align:-2px;align-self:center}
.ic.round{border-radius:50%}
.inputrow>.ic{margin-inline-start:12px}
.flag{display:inline-grid;place-items:center;width:32px;height:24px;background:var(--box);border:1px solid var(--line);font:600 9px/1 ui-monospace,monospace;color:var(--mute);flex:none;direction:ltr}
.flag.lg{width:64px;height:48px;font-size:12px}
h1{font-size:28px;line-height:1.2;margin:28px 0 12px;font-weight:700}
h2{font-size:20px;line-height:1.25;margin:40px 0 12px;font-weight:700}
h3{font-size:16px;line-height:1.3;margin:20px 0 6px}
p{margin:0 0 12px}
.mute{color:var(--mute)}
.small{font-size:13px}
code,.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;direction:ltr;unicode-bidi:isolate}
pre.code{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;margin:0;padding:12px;background:var(--box2);border:1px solid var(--line);border-radius:8px;text-align:start;line-height:1.5}
.codewrap{position:relative}
.codehead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-block-end:6px}
.codehead .lab{font-size:12px;color:var(--mute)}
.field label{display:block;font-weight:600;margin-block-end:2px}
.field .hint{font-size:13px;color:var(--mute);margin-block-end:8px}
.inputrow{display:flex;align-items:stretch;border:1.5px solid var(--fg);border-radius:8px;background:var(--panel)}
.inputrow input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:17px;padding:10px 12px;color:var(--fg);min-height:48px}
.inputrow input:focus{outline:none}
.inputrow:focus-within{outline:3px solid var(--fg);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-block:10px}
.chip{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:22px;background:var(--panel);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--inv);color:var(--invfg);border-color:var(--inv)}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 0;border-block-end:1px solid var(--line);text-decoration:none;cursor:pointer;width:100%;background:none;border-inline:0;border-block-start:0;text-align:start}
.row:last-child{border-block-end:0}
.row .grow{flex:1;min-width:0}
.row .sec{font-size:13px;color:var(--mute)}
.tag{font-size:12px;border:1px solid var(--fg);border-radius:4px;padding:0 6px;white-space:nowrap}
.chev{flex:none;display:inline-block;width:8px;height:8px;border-block-start:2px solid currentColor;border-inline-end:2px solid currentColor;transform:rotate(45deg)}
[dir=rtl] .chev{transform:rotate(-45deg)}
.skel{background:var(--box);border-radius:4px;height:14px}
.skelrow{display:flex;gap:12px;align-items:center;min-height:52px;border-block-end:1px solid var(--line)}
.note{border:1px solid var(--fg);border-radius:8px;padding:12px;margin-block:12px;background:var(--panel)}
.note.err{border-width:2px}
.note .t{font-weight:700;display:flex;gap:8px;align-items:center;margin-block-end:4px}
.toast{position:sticky;inset-block-end:12px;margin:12px 20px;padding:12px;background:var(--inv);color:var(--invfg);border-radius:8px;z-index:3;display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--fg);border-radius:8px;overflow:hidden}
.seg button{min-height:44px;padding:0 12px;border:0;border-inline-start:1px solid var(--fg);background:var(--panel);cursor:pointer;font-size:14px}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed=true],.seg button[aria-checked=true]{background:var(--inv);color:var(--invfg);font-weight:700}
.seglab{display:block;font-size:13px;color:var(--mute);margin-block:12px 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
.big{font-size:26px;font-weight:700;line-height:1.1;display:block}
.facts dt{font-size:13px;color:var(--mute);padding-block-start:10px}
.facts dd{margin:0;padding-block-end:10px;border-block-end:1px solid var(--line)}
.kv{display:grid;grid-template-columns:38% 1fr;gap:4px 12px;padding-block:10px;border-block-end:1px solid var(--line)}
.kv:last-child{border-block-end:0}
.kv .k{font-size:13px;color:var(--mute)}
.kv .k code{display:block;font-size:11px;margin-block-start:2px;text-align:start;overflow-wrap:anywhere}
.kv .v{min-width:0;overflow-wrap:anywhere}
.sec2{border-block-start:2px solid var(--fg);margin-block-start:32px;padding-block-start:4px}
.fn{font-size:11px;vertical-align:super;text-decoration:none;padding:0 2px}
details{border-block-end:1px solid var(--line)}
summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:600;padding-block:10px;list-style:none;gap:10px}
summary::after{content:"+";margin-inline-start:auto;font-weight:400}
details[open] summary::after{content:"−"}
.foot{margin-block-start:48px;padding:24px 20px 40px;border-block-start:2px solid var(--fg);font-size:14px}
.foot ul{list-style:none;padding:0;margin:0 0 16px;display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.foot li a{display:flex;align-items:center;min-height:44px}
.crumbs{font-size:13px;margin-block-start:16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumbs a{min-height:44px;display:inline-flex;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bar{position:sticky;inset-block-end:0;background:var(--panel);border-block-start:2px solid var(--fg);padding:10px 20px 14px;z-index:3}
.navlist a{display:flex;align-items:center;justify-content:space-between;min-height:52px;border-block-end:1px solid var(--line);text-decoration:none;font-size:17px}
.na-frame{margin:40px 20px;padding:16px;border:2px dashed var(--fg);font-size:14px}
.badge{display:inline-block;font-size:12px;border:1px solid var(--fg);border-radius:4px;padding:0 6px;margin-inline-start:6px}
.stack{display:flex;flex-direction:column;gap:8px}
.hr{border:0;border-block-start:1px solid var(--line);margin:16px 0}
.check{display:flex;align-items:center;gap:10px;min-height:48px;border-block-end:1px solid var(--line);cursor:pointer}
.check .box{width:22px;height:22px;border:2px solid var(--fg);border-radius:4px;display:grid;place-items:center;flex:none;font-size:14px;font-weight:700}
.check[aria-checked=true] .box{background:var(--inv);color:var(--invfg)}
.check .grow{flex:1}
@media (prefers-reduced-motion:no-preference){.wf .fade{animation:fd .2s ease-out}@keyframes fd{from{opacity:0}to{opacity:1}}}
</style></head>

ل الجوال يقبل الأرقام العربية","Phone fields accept Arabic digits"],"home.native.digits.body":["اكتب الرقم بالأرقام العربية أو الفارسية، وتحوّلها `parsePhone()` إلى أرقام غربية قبل التحقق.","Type the number in Arabic-Indic or Persian digits; `parsePhone()` turns them into Western digits before it checks."],"home.native.digits.result":["النتيجة واحدة للرقم {number} أيًّا كانت أرقامه:","Same result for {number} in any of the three digit sets:"],"home.native.sort":["الترتيب الأبجدي العربي الصحيح","Correct Arabic alphabetical order"],"home.native.sort.value":["«السعودية» تحت حرف السين لا الألف","«السعودية» sorts under س, not ا"],"policy.title":["سياسة البيانات","Data policy"],"policy.palestine":["**فلسطين** دولة، عاصمتها «القدس». الأرقام التي تبدأ بـ **+970 و+972** (ومنها القدس وأراضي 48) أرقام فلسطينية. عملاتها الدينار الأردني و«الشيكل».","**Palestine** is «فلسطين» / \"Palestine\", a country, with its capital «القدس» / \"Jerusalem\". Numbers with **+970 and +972** (including Jerusalem and the 1948 lines) are Palestinian numbers here. Its currencies are the Jordanian dinar and the shekel (shown as «شيكل» / \"Shekel\")."],"policy.disputed":["**الأماكن المتنازع عليها تتبع المواقف الرسمية للمملكة العربية السعودية:** الصحراء الغربية جزء من المغرب، وكوسوفو مدرجة، وشمال قبرص غير مدرجة، وتايوان وهونغ كونغ ومكاو أقاليم لها جنسية.","**Disputed places follow the official positions of Saudi Arabia:** Western Sahara is part of Morocco (no separate row), Kosovo is included, Northern Cyprus is not, and Taiwan, Hong Kong and Macau are territories that still have a nationality (they issue their own passports)."],"policy.requests":["طلبات تغيير هذه السياسة تُغلق دون نقاش، ونرحّب بتصحيح البيانات مع رابط المصدر.","Requests to change this policy are closed without discussion. Corrections to data are welcome with a source link."],"policy.full":["السياسة كاملة على GitHub","Full policy on GitHub"],"faq.title":["الأسئلة الشائعة","Questions and answers"],"faq.q1":["أين أجد قائمة الدول بالعربية؟","How do I get a list of countries in Arabic?"],"faq.a1":["في `data/worldref.ar.json`، ورتّبها حسب الحقل `sort`.","Use `data/worldref.ar.json` (or `data/modules/core.ar.json` for names only). Each row has `name` in Arabic. For a ready-made picker order, sort by `sort` (it ignores «ال» and hamza forms)."],"faq.q2":["أين أجد قائمة الجنسيات بالعربية مذكرًا ومؤنثًا؟","Where is a list of nationalities in Arabic, masculine and feminine?"],"faq.a2":["في `data/modules/nationality.json`: الحقلان `nationality_ar_m` و`nationality_ar_f`.","`data/modules/nationality.json`: `nationality_ar_m` (سعودي) and `nationality_ar_f` (سعودية), plus `nationality_en` (Saudi)."],"faq.q3":["كيف أتحقق من رقم جوال سعودي؟","How do I validate a Saudi mobile number?"],"faq.a3":["`parsePhone(input, byIso2(\"SA\"))` ثم تحقق من `valid` و`mobile`. تُقبل الأرقام العربية.","`parsePhone(input, byIso2(\"SA\"))` and check `valid && mobile`. The rule is in `phone[0].mobile_pattern`: 9 digits starting with 50, 51, 53 to 59 after dropping the leading 0. Arabic digits are accepted."],"faq.q4":["لماذا قيمة `travel.emergency.police` فارغة في بعض الدول؟","Why is `travel.emergency.police` null for some countries?"],"faq.a4":["لا ننشر الرقم إلا إذا أكّده مصدر رسمي. إذا كانت الخدمة `null` فاتصل بالرقم العام `general`.","Only numbers confirmed by an official source are published. If a service is null, call `general`."],"faq.q5":["هل يمكنني استخدام worldref في مشروع تجاري؟","Can I use this commercially?"],"faq.a5":["نعم. الكود بترخيص MIT، وتراخيص البيانات كلها (Unicode وApache-2.0 وCC-BY-4.0 وCC0 والملكية العامة) تسمح بالاستخدام التجاري مع ذكر المصدر متى اشتُرط.","Yes. Code is MIT; data licences (Unicode, Apache-2.0, CC-BY-4.0, CC0, public domain) all allow commercial use with attribution where required."],"faq.q6":["ما مدى حداثة البيانات؟","How current is it?"],"faq.a6":["تفحص مهمة آلية المصادر كل شهر (وبيانات السكان كل ثلاثة أشهر)، وتصدر تحديثًا متى تغيّرت ونجحت الاختبارات كلها. الإصدارات في `data/meta.json`.","An automated job checks the upstream sources monthly (population quarterly) and releases a patch when they change and every test passes. Versions are in `data/meta.json`."],"agents.title":["لوكلاء الذكاء الاصطناعي","For AI agents"],"agents.body":["كل ما يحتاجه الوكيل ليقرأ البيانات ويجيب منها وحدها.","Everything an agent needs to read the data and answer from it alone."],"agents.mcp.title":["خادم MCP","MCP server"],"agents.mcp.tools":["الأدوات: {tools}","Tools: {tools}"],"agents.files.title":["ملفات للقراءة","Files to read"],"agents.file.llms":["فهرس مختصر للوكلاء","Short index for agents"],"agents.file.llms-full":["كل حقل مع سجل كامل مثالًا","Every field, with a full example record"],"agents.file.agents-md":["دليل لوكلاء البرمجة","Guide for coding agents"],"agents.file.openapi":["واجهة API الثابتة بمواصفة OpenAPI","The static API as an OpenAPI description"],"agents.file.schema":["JSON Schema لكل ملف ولكل نسخة","A JSON Schema for every file and build"],"agents.file.country":["دولة واحدة برمز iso2 بحروف صغيرة","One country, by lowercase iso2"],"agents.offline.body":["الأوامر والروابط تُنسخ، وفتح الملفات يحتاج اتصالًا.","Commands and links still copy; opening the files needs a connection."],"agents.rules.title":["قواعد الإجابة من البيانات","Rules for answering from this data"],"agents.rules.null":["أجب من البيانات فقط. القيمة `null` أو القائمة الفارغة تعني أنها مجهولة: قل ذلك ولا تخمّن.","Answer from the data only. `null` or an empty list means unknown: say so, never guess."],"agents.rules.phone":["احفظ رقم الجوال بالصيغة الدولية (E.164) مع رمز `iso2` للدولة التي اختارها المستخدم.","Store phone numbers in international form (E.164) plus the `iso2` the user picked."],"agents.rules.emergency":["أرقام الطوارئ منشورة فقط إذا أكّدها مصدر رسمي، والخدمة `null` تعني: اتصل بالرقم العام `general`.","Emergency numbers are published only when an official source confirms them. A null service means: call `general`."],"notfound.title":["هذه الصفحة غير موجودة","This page doesn't exist"]," // Text folding shared by search and sorting. Mirrors scripts/lib/text.mjs; tests/vectors.json keeps every
// language package identical to it.
const DIGITS = /[٠-٩۰-۹]/g;
const MARKS = /[ً-ٰٟـ]/g;
const LETTERS = { "أ": "ا", "إ": "ا", "آ": "ا", "ٱ": "ا", "ة": "ه", "ى": "ي", "ؤ": "و", "ئ": "ي" };
/** Arabic-Indic (٠-٩) and Persian (۰-۹) digits to Western (0-9). Nothing else changes. */
function westernDigits(text) {
    return text.replace(DIGITS, (d) => String(d.charCodeAt(0) & 0xf));
}
/** Folds a name or a query for matching: case, accents, Arabic letter variants, tashkeel, tatweel, «ال», punctuation. */
function normalize(text) {
    return westernDigits(text)
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "")
        .toLowerCase()
        .replace(MARKS, "")
        .replace(/[أإآٱةىؤئ]/g, (c) => LETTERS[c])
        .replace(/[^\p{L}\p{N}]+/gu, " ")
        .trim()
        .split(" ")
        .map((w) => (w.startsWith("ال") && w.length > 3 ? w.slice(2) : w))
        .join(" ");
}


/**

 * hamza forms, case and accents), ISO codes, and dial codes with or without «+» or «00».
 */
function search(countries, query, lang = "en") {
    const q = normalize(query);
    if (!q)
        return [];
    const digits = westernDigits(query).replace(/[\s()-]/g, "");
    const dial = /^(\+|00)?\d{1,4}$/.test(digits) ? digits.replace(/^(\+|00)/, "") : null;
    const scored = [];
    for (const c of countries) {
        const own = normalize(lang === "ar" ? c.name_ar : c.name_en);
        const other = normalize(lang === "ar" ? c.name_en : c.name_ar);
        const aliases = [...c.aliases_ar, ...c.aliases_en].map(normalize);
        // Tiers: exact (50s), name starts with the query (40s), a word starts with it (30s), contains it (10s).
        // Within a tier: the UI-language name, then the other language, then aliases.
        const rank = (name, place) => {
            if (name === q)
                return 50 - place;
            if (name.startsWith(q))
                return 40 - place;
            if (name.split(" ").some((w) => w.startsWith(q)))
                return 30 - place;
            if (q.length >= 3 && name.includes(q))
                return 10 - place;
            return 0;
        };
        let score = Math.max(rank(own, 0), rank(other, 1), ...aliases.map((a) => rank(a, 2)));

        if (upper === c.iso2 || upper === c.iso3)
            score = Math.max(score, 49.5);
        const codes = (c.phone ?? []).map((p) => ({ cc: p.calling_code.slice(1), primary: p.primary }));
        if (dial && codes.some((p) => p.cc === dial))
            score = Math.max(score, codes.some((p) => p.cc === dial && p.primary) ? 46 : 45);

            score = Math.max(score, 5);

 * Reads what a user typed into a phone field. `country` is the one picked in the field; numbers typed with
 * «+» or «00» are matched against `all` (or `country` alone if `all` is not given).
 */
function parsePhone(input, country, all) {
    let s = westernDigits(input).replace(/[^\d+]/g, "");
    if (!s)
        return null;
    let plans = [];
    if (s.startsWith("+") || s.startsWith("00")) {
        s = s.replace(/^(\+|00)/, "");
        for (const c of all ?? [country])
            for (const plan of c.phone) {
                const cc = plan.calling_code.slice(1);
                if (!s.startsWith(cc))
                    continue;
                const rest = s.slice(cc.length);
                if (plan.leading_digits && !new RegExp(`^(?:${plan.leading_digits})`).test(rest))
                    continue;
                plans.push({ iso2: c.iso2, plan, rest });

        // then one whose mobile pattern fits, then a secondary plan whose own pattern fits, then the main country.

            (p.plan.leading_digits ? 8 : 0) +
            (fullMatch(p.plan.mobile_pattern, p.rest) ? 4 : 0) +
            (!p.plan.primary && fullMatch(p.plan.pattern, p.rest) ? 2 : 0) +
            (p.plan.primary ? 1 : 0);

        for (const plan of country.phone) {

        e164: `${pick.plan.calling_code}${pick.rest}`,
        iso2: pick.iso2,
        calling_code: pick.plan.calling_code,

function formatNational(national, plan) {
    const mask = plan.mobile_format;
    if (!mask || mask.replace(/[^#]/g, "").length !== national.length)
        return national;
    let i = 0;
    return mask.replace(/#/g, () => national[i++]);

const SAMPLE = {

const CHIPS = ["الامارات", "00971", "KSA", "+1"];
const dial = (c) => c.phone.map((p) => p.calling_code).join(" ");
const nm = (c, l) => (l || st.lang) === "ar" ? c.name_ar : c.name_en;

function countryRow(c, pinned) {
  return html`<li><a class="row" href="#" data-act="country:${c.iso2.toLowerCase()}">${flag(c.iso2)}
  <span class="grow"><span>${esc(nm(c))}</span> <span class="sec" lang="${other()}">(${esc(nm(c, other()))})</span>${pinned ? ` <span class="tag">${t("search.region")}</span>` : ""}</span>
  <span class="small">${ltr(dial(c) || "")}</span>${chev()}</a></li>`;
}

function searchBlock(state, idp = "q") {
  const q = st.q || "";
  const chips = CHIPS.map((c) => `<button class="chip" type="button" aria-pressed="${q === c}" data-act="chip:${esc(c)}"><bdi${/[A-Za-z\u0621-\u064A]/.test(c) ? "" : ' dir="ltr"'}>${esc(c)}</bdi></button>`).join("");
  let res = "";
  if (state === "loading") {
    res = `<p class="sr" role="status">${t("search.loading.label")}</p>` + Array.from({ length: 5 }, (_, i) => `<div class="skelrow" aria-hidden="true"><span class="flag"></span><span class="skel" style="width:${[55, 40, 62, 48, 35][i]}%"></span></div>`).join("");
  } else if (state === "error") {
    res = `<div class="note err" role="alert"><div class="t">${ic("warning")}${t("search.error.body")}</div><button class="btn sm" data-act="retry:">${ic("rotate")}${t("action.retry")}</button></div>`;
  } else if (!q.trim()) {
    const list = sortCountries(D.countries, st.lang, st.region || null).slice(0, 5);
    res = idp === "q404" ? "" : `<ul class="list">${list.map((c, i) => countryRow(c, i === 0 && st.region && c.iso2 === st.region)).join("")}</ul>
    <a class="row" href="#" data-act="xnav:countries" style="font-weight:600"><span class="grow">${t("search.list.all", { count: D.meta.countries })}</span>${chev()}</a>`;
  } else {
    const hits = search(D.countries, q, st.lang);
    if (!hits.length) {
      res = `<div class="note" role="status"><p style="margin:0 0 10px">${t("search.empty.body", { q })}</p><button class="btn sm" data-act="clear:">${t("search.empty.action")}</button></div>`;
    } else {
      const shown = st.showAll ? hits : hits.slice(0, 8);
      res = `<p class="small mute" role="status" style="margin:8px 0 0">${plural("search.results.count", hits.length)}</p>
      <ul class="list">${shown.map((c) => countryRow(c)).join("")}</ul>
      ${hits.length > 8 && !st.showAll ? `<button class="btn sm" style="width:100%;margin-block:8px" data-act="showall:">${t("search.results.more", { n: hits.length })}</button>` : ""}
      <p class="small mute" style="margin-block-start:8px">${t("search.results.source")}</p>`;
    }
  }
  return html`<section aria-labelledby="${idp}-l" style="margin-block-start:28px">
  <div class="field"><label for="${idp}" id="${idp}-l">${t("search.label")}</label><div class="hint" id="${idp}-h">${t("search.hint")}</div>
  <div class="inputrow">${ic("magnifying-glass")}<input id="${idp}" data-input="q" dir="${q && !/[\u0600-\u06FF]/.test(q) ? "ltr" : "auto"}" type="search" autocomplete="off" enterkeyhint="search" aria-describedby="${idp}-h" value="${esc(q)}" style="padding-inline-start:4px">
  ${q ? `<button class="btn ghost sm" data-act="clear:" aria-label="${tt("search.clear")}">${ic("xmark")}</button>` : ""}</div></div>
  <div class="chips"><span class="small mute">${t("search.try")}</span>${chips}</div>
  ${state === "offline" ? offlineLine("search.offline.body") : ""}
  <div aria-live="polite">${res}</div></section>`;
}

  if (st.copyError === id) { const pre = document.getElementById("pre-" + id); if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } }
}
dev.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  e.preventDefault();
  st.taps++;
  const [act, ...rest] = el.dataset.act.split(":");
  const arg = rest.join(":");
  if (act === "menu") { st.menu = arg === "open"; render(true); return; }
  if (act === "lang") { st.lang = arg; st.menu = false; render(true); return; }
  if (act === "theme") { st.themeChoice = arg; st.theme = arg === "dark" ? "dark" : "light"; render(true); return; }
  if (act === "copy") { doCopy(arg, el.dataset.text); return; }
  if (act === "ext") { render(true); return; }
  if (act === "xnav") {
    const [file, params] = XNAV[arg];
    if (FLOW.file === file.split("/")[1] && FLOW.screens[params.screen]) { go(params.screen, params.state); if (params.anchor) { const a = document.getElementById(params.anchor); a && a.scrollIntoView(); } return; }
    xlink(file, params); return;
  }
  if (act === "go") { const [s, state] = arg.split("@"); go(s, state); return; }
  FLOW.act(act, arg, el, st);
  render(true);
});
dev.addEventListener("input", (e) => { const el = e.target; if (el.dataset.input) { FLOW.input(el.dataset.input, el.value, st); render(true); } });
dev.addEventListener("submit", (e) => { e.preventDefault(); st.taps++; FLOW.act("submit", e.target.dataset.form, e.target, st); render(true); });
dev.addEventListener("toggle", (e) => {}, true);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && st.menu) { st.menu = false; render(true); } });
toolsEl.addEventListener("click", (e) => {
  const b = e.target.closest("[data-tool]"); if (!b) return;
  const [k, v] = b.dataset.tool.split(":");
  if (k === "screen") { st.screen = v; setState(st.state); st.menu = false; render(); scroller.scrollTop = 0; return; }
  if (k === "state") { setState(v); render(); return; }
  if (k === "lang") st.lang = v;
  if (k === "theme") { st.theme = v; st.themeChoice = v; }
  if (k === "region") { st.region = v; FLOW.onState && FLOW.onState(st.state, st); }
  if (k === "taps") st.taps = 0;
  render(true);
});
document.getElementById("toolsToggle").addEventListener("click", () => toolsEl.classList.toggle("open"));
setState(st.state);
render();
if (Q.get("anchor")) { const a = document.getElementById(Q.get("anchor")); a && a.scrollIntoView(); }

</script></body></html>
