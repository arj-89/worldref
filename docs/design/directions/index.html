<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>worldref K4 directions: home</title>
<!-- K4 directions for the worldref home (flow 1). Three structurally different directions of one core screen, switched by ?direction=a|b|c and the floating bar.
     Self-contained: no external requests. Fonts are OFL families from the Google Fonts pool, converted to woff2 unchanged, in ./fonts/.
     Flags are the repo's own flags/ files (same repository, relative path). Copy comes from docs/design/flows/onboarding/WORDING.md (plus build.lang.label from flows/builder).
     Data comes from data/meta.json, data/api/v1/index.json and the D1 search rows derived from data/worldref.json. Search runs dist/text.js and dist/helpers.js inlined unchanged.
     Icons: Font Awesome Free 7.3.1, classic solid plus fa-brands GitHub, CC BY 4.0 (attribution in the footer). Designer model: Opus 5.5 (claude-opus-5-5). 02/11/2026. -->
<style>
@font-face{font-family:"Plex Arabic";src:url("fonts/ibm-plex-sans-arabic-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Plex Arabic";src:url("fonts/ibm-plex-sans-arabic-600.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Kufi";src:url("fonts/noto-kufi-arabic-var.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Rubik";src:url("fonts/rubik-var.woff2") format("woff2");font-weight:300 900;font-display:swap}
@font-face{font-family:"JBM";src:url("fonts/jetbrains-mono-400.woff2") format("woff2");font-weight:400;font-display:swap}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#8a8a8a}
#site{min-height:100dvh;overflow-x:clip;background:var(--bg)}
body.capture #tool{display:none}
:where(#site) :where(h1,h2,h3,p,ul,ol,dl,dd,figure){margin:0}
:where(#site) :where(ul,ol){padding:0;list-style:none}
:where(#site) a{color:inherit}
:where(#site) :where(button,input){font:inherit;color:inherit}
:where(#site) img{display:block}
:where(#site) .fa{display:inline-block;height:1em;width:auto;flex:none;overflow:visible;vertical-align:-0.125em}
:where(#site[dir=rtl]) .fa.flip{transform:scaleX(-1)}
#site .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:where(#site) .skip{position:absolute;inset-inline-start:12px;inset-block-start:-60px;z-index:20;padding:10px 14px}
:where(#site) .skip:focus{inset-block-start:12px}
:where(#site) :where(code,.mono){font-family:"JBM",ui-monospace,Menlo,Consolas,monospace;direction:ltr;unicode-bidi:isolate}
:where(#site) bdi{unicode-bidi:isolate}
:where(#site) .flag{flex:none;object-fit:cover;background:var(--hair)}
@media (prefers-reduced-motion:no-preference){#site .moment{animation:moment var(--moment-dur,120ms) var(--moment-ease,ease-out)}@keyframes moment{from{opacity:.6}to{opacity:1}}}

/* ---------- tooling: visibly not part of the design ---------- */
#tool{position:fixed;inset-block-end:10px;inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100% - 16px);z-index:50;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:8px 10px;background:#ffef8a;color:#111;border:2px dashed #111;font:12px/1.3 ui-monospace,Menlo,Consolas,monospace;direction:ltr;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#tool button{font:inherit;min-height:32px;padding:0 10px;border:1px solid #111;background:#fff8c4;color:#111;cursor:pointer}
#tool button[aria-pressed=true]{background:#111;color:#ffef8a}
#tool .name{font-weight:700;padding-inline:6px;min-width:13ch;text-align:center}
#tool .grp{display:flex;gap:3px;align-items:center}
#tool .note{opacity:.75}
#tool select{font:inherit;min-height:32px;border:1px solid #111;background:#fff8c4;color:#111}
#ribbon{font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;background:#ffef8a;color:#111;border-block-end:2px dashed #111;padding:6px 12px;direction:ltr;text-align:left}
#ribbon .riy{font-size:15px}

/* =========================================================
   Direction A: Docs shell (seed: Astro Docs in Arabic)
   ========================================================= */
.dir-a{--bg:#f8faf9;--nav:#eef2f0;--code:#f0f3f1;--codehead:#e3e9e6;--hair:#dde4e0;--line:#b7c1bc;--text:#2b3330;--strong:#121715;--muted:#525d58;--accent:#0b7a5c;--accent-high:#064c39;--accent-low:#d3ebe2;--on-accent:#f8faf9;--focus:#0b7a5c;
  --moment-dur:120ms;background:var(--bg);color:var(--text);font:400 1rem/1.75 "Plex Arabic",system-ui,sans-serif}
.dir-a[data-theme=dark]{--bg:#121614;--nav:#181d1b;--code:#1a201d;--codehead:#232b27;--hair:#29312d;--line:#46514c;--text:#c6d0cb;--strong:#eef3f0;--muted:#97a39d;--accent:#5fd4a8;--accent-high:#c3f2df;--accent-low:#14392c;--on-accent:#0b1a14;--focus:#5fd4a8}
.dir-a :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.dir-a .skip{background:var(--nav);border:1px solid var(--line)}
.dir-a .hdr{display:flex;align-items:center;gap:16px;height:64px;padding-inline:24px;background:var(--nav);border-block-end:1px solid var(--hair)}
.dir-a .wm{font-weight:600;font-size:1.25rem;color:var(--strong);text-decoration:none;direction:ltr;unicode-bidi:isolate;display:inline-flex;align-items:center;min-height:44px}
.dir-a .hdr .end{margin-inline-start:auto;display:flex;gap:4px;align-items:center}
.dir-a .iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;min-height:44px;padding-inline:10px;border:0;border-radius:4px;background:transparent;color:var(--text);text-decoration:none;cursor:pointer;font-size:.9375rem}
.dir-a .iconbtn:hover{background:var(--codehead)}.dir-a .iconbtn:active{background:var(--hair)}
.dir-a .shell{display:grid;grid-template-columns:1fr}
.dir-a .side{display:none}
.dir-a .main{padding:32px 20px 0;min-width:0}
.dir-a .col{max-width:45rem;margin-inline:auto}
@media (min-width:1000px){
  .dir-a .shell{grid-template-columns:18.75rem minmax(0,1fr)}
  .dir-a .side{display:block;border-inline-end:1px solid var(--hair);padding:24px 16px}
  .dir-a .menu-btn{display:none}
  .dir-a .main{padding:48px 40px 0}
}
.dir-a .side ul{display:grid;gap:2px}
.dir-a .side a{display:flex;align-items:center;min-height:44px;padding:6px 10px;border-radius:4px;text-decoration:none;font-size:.875rem;font-weight:600;color:var(--muted)}
.dir-a .side a:hover{background:var(--codehead);color:var(--strong)}
.dir-a .side a[aria-current=page]{background:var(--accent);color:var(--on-accent)}
.dir-a h1{font-weight:600;font-size:clamp(1.875rem,1.1rem + 2.4vw,2.625rem);line-height:1.2;color:var(--strong);margin-block:0 16px}
.dir-a .lead{font-size:1.125rem;color:var(--text);max-width:40rem}
.dir-a .actions{display:flex;flex-wrap:wrap;gap:12px;margin-block:24px 0}
.dir-a .btn{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding-inline:18px;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--strong);font-weight:600;text-decoration:none;cursor:pointer}
.dir-a .btn:hover{background:var(--codehead)}.dir-a .btn:active{background:var(--hair)}
.dir-a .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dir-a .btn.pri:hover{background:var(--accent-high);border-color:var(--accent-high)}
.dir-a[data-theme=dark] .btn.pri:hover{color:#0b1a14}
.dir-a .frame{margin-block:40px 0;border:1px solid var(--line);border-radius:2px;background:var(--code)}
.dir-a .frame-h{display:flex;align-items:center;gap:10px;padding:6px 14px;background:var(--codehead);border-block-end:1px solid var(--line);font-size:.9rem;font-weight:600;color:var(--strong);min-height:40px}
.dir-a .frame-h .fa{color:var(--accent)}
.dir-a .frame-b{padding:16px 14px 14px}
.dir-a .hint{font-size:.875rem;color:var(--muted);margin-block:0 10px}
.dir-a .field{display:flex;align-items:center;gap:8px;min-height:48px;padding-inline:12px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.dir-a .field:focus-within{outline:2px solid var(--focus);outline-offset:1px}
.dir-a .field .fa{color:var(--muted)}
.dir-a .field input{flex:1;min-width:0;border:0;background:transparent;font-size:1.0625rem;min-height:46px;outline:none}
.dir-a .chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-block:12px 4px;font-size:.875rem;color:var(--muted)}
.dir-a .chip{min-height:44px;padding-inline:10px;border:1px solid var(--hair);border-radius:4px;background:var(--codehead);color:var(--strong);cursor:pointer;font-size:.875rem}
.dir-a .chip:hover{border-color:var(--line)}.dir-a .chip[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.dir-a .res{margin-block-start:12px}
.dir-a .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:.875rem;color:var(--muted);padding-block:6px}
.dir-a .row{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 8px;margin-inline:-8px;border-radius:4px;text-decoration:none;color:var(--strong)}
.dir-a .row:hover{background:var(--codehead)}.dir-a .row:active{background:var(--hair)}
.dir-a .row .flag{width:24px;height:18px;border-radius:2px}
.dir-a .row .nm{flex:1;min-width:0}
.dir-a .row .oth{font-size:.8125rem;color:var(--accent)}
.dir-a .row .dial{font-size:.8125rem;color:var(--muted)}
.dir-a .tag{font-size:.75rem;font-weight:600;padding:1px 6px;border-radius:4px;border:1px solid var(--accent);color:var(--accent);margin-inline-start:6px;white-space:nowrap}
.dir-a .more{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-weight:600;color:var(--accent);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.dir-a .note .more{color:var(--accent-high)}
.dir-a .src{font-size:.8125rem;color:var(--muted);margin-block-start:8px}
.dir-a .note{border-inline-start:4px solid var(--accent);background:var(--accent-low);padding:14px 16px;margin-block:10px 0;color:var(--strong)}
.dir-a .skel{display:flex;align-items:center;gap:12px;min-height:48px}
.dir-a .skel i{display:block;height:12px;border-radius:2px;background:var(--hair)}
.dir-a h2{font-weight:600;font-size:clamp(1.5rem,1.1rem + 1.4vw,2.1875rem);line-height:1.2;color:var(--strong);margin-block:72px 18px;scroll-margin-top:24px}
.dir-a .facts{display:grid;grid-template-columns:auto 1fr;border-block-start:1px solid var(--hair)}
.dir-a .facts dt,.dir-a .facts dd{padding:12px 0;border-block-end:1px solid var(--hair)}
.dir-a .facts dt{font-family:"JBM",ui-monospace,monospace;font-size:1.25rem;color:var(--strong);padding-inline-end:24px;text-align:end;font-variant-numeric:tabular-nums}
.dir-a .facts dd .sub{display:block;font-size:.875rem;color:var(--muted)}
.dir-a .version{font-size:.875rem;color:var(--muted);margin-block-start:12px}
.dir-a .links{display:grid;gap:12px}
.dir-a .lc{display:flex;align-items:center;gap:16px;padding:16px;border:1px solid var(--hair);border-radius:4px;text-decoration:none;color:var(--text)}
.dir-a a.lc:hover{border-color:var(--line);background:var(--code)}
.dir-a .lc strong{display:block;color:var(--strong);font-weight:600}
.dir-a .lc .grow{flex:1;min-width:0}
.dir-a .lc .fa.flip{color:var(--accent)}
.dir-a .urlrow{display:flex;align-items:stretch;gap:0;margin-block-start:10px;border:1px solid var(--line);border-radius:2px;background:var(--code)}
.dir-a .urlrow code{flex:1;min-width:0;padding:10px 12px;font-size:.8125rem;overflow-wrap:anywhere;color:var(--strong);text-align:left}
.dir-a .urlrow button{border:0;border-inline-start:1px solid var(--line);background:var(--codehead);padding-inline:12px;min-height:44px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:.875rem;font-weight:600;white-space:nowrap}
.dir-a .kv{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding-block:10px;border-block-end:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.dir-a .kv:last-child{border-block-end:0}
.dir-a .kv .k{font-size:.875rem;color:var(--muted)}
.dir-a[data-theme=dark] .note .kv .k{color:#a9c9bc}
.dir-a .kv code{font-size:.8125rem;overflow-wrap:anywhere}
.dir-a .bul{list-style:disc;padding-inline-start:1.25rem;display:grid;gap:10px}
.dir-a .faq details{border-block-end:1px solid var(--hair)}
.dir-a .faq summary{min-height:52px;display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:600;color:var(--strong);list-style:none;padding-block:10px}
.dir-a .faq summary::-webkit-details-marker{display:none}
.dir-a .faq summary .fa{margin-inline-start:auto;color:var(--muted);transition:transform .15s ease-out}
.dir-a .faq details[open] summary .fa{transform:rotate(90deg)}
.dir-a[dir=rtl] .faq details[open] summary .fa{transform:scaleX(-1) rotate(90deg)}
.dir-a .faq p{padding-block:0 16px}
.dir-a .foot{margin-block-start:96px;border-block-start:1px solid var(--hair);background:var(--nav);padding:32px 20px 40px}
.dir-a .foot .col{display:grid;gap:20px}
.dir-a .foot ul{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:0 16px}
.dir-a .foot li a{display:flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;font-size:.9375rem}
.dir-a .foot li a:hover{color:var(--accent)}
.dir-a .foot .lic{font-size:.8125rem;color:var(--muted)}
.dir-a .seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.dir-a .seg button,.dir-a .seg a{min-height:44px;padding-inline:14px;border:0;border-inline-start:1px solid var(--line);background:transparent;cursor:pointer;font-size:.875rem;display:inline-flex;align-items:center;text-decoration:none}
.dir-a .seg :first-child{border-inline-start:0}
.dir-a .seg [aria-current=true],.dir-a .seg [aria-pressed=true]{background:var(--accent);color:var(--on-accent);font-weight:600}
.dir-a .switches{display:flex;flex-wrap:wrap;gap:16px 24px}
.dir-a .switches label{display:block;font-size:.8125rem;color:var(--muted);margin-block-end:6px}

/* =========================================================
   Direction B: Fact sheet (seed: Apple Saudi Arabia iPhone specs)
   ========================================================= */
.dir-b{--bg:#fbfbfc;--text:#1d1d1f;--muted:#64646a;--hair:#d2d2d7;--field:#f0f0f3;--accent:#0b5cad;--accent-hover:#084a8c;--on-accent:#fbfbfc;--focus:#0b5cad;
  --moment-dur:200ms;background:var(--bg);color:var(--text);font:400 1.0625rem/1.47 "Plex Arabic",system-ui,sans-serif}
.dir-b[data-theme=dark]{--bg:#111113;--text:#f2f2f4;--muted:#a3a3aa;--hair:#38383d;--field:#1d1d20;--accent:#5ea6ff;--accent-hover:#8cc0ff;--on-accent:#0b0b0d;--focus:#5ea6ff}
.dir-b :focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:4px}
.dir-b .skip{background:var(--bg);border:1px solid var(--hair)}
.dir-b .kufi{font-family:"Kufi","Plex Arabic",system-ui,sans-serif}
.dir-b .wrap{max-width:980px;margin-inline:auto;padding-inline:22px}
.dir-b .lnav{border-block-end:1px solid var(--hair)}
.dir-b .lnav .wrap{display:flex;align-items:center;gap:20px;min-height:52px}
.dir-b .wm{font-family:"Kufi",system-ui,sans-serif;font-weight:600;font-size:1.3125rem;text-decoration:none;direction:ltr;unicode-bidi:isolate;min-height:44px;display:inline-flex;align-items:center}
.dir-b .lnav nav{margin-inline-start:auto;display:flex;align-items:center;gap:4px}
.dir-b .lnav nav a.tl{display:none;font-size:.75rem;min-height:44px;align-items:center;padding-inline:8px;text-decoration:none;color:var(--muted)}
.dir-b .lnav nav a.tl:hover{color:var(--text)}
@media (min-width:860px){.dir-b .lnav nav a.tl{display:inline-flex}.dir-b .menu-btn{display:none}}
.dir-b .pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding-inline:20px;border-radius:980px;border:0;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:600;font-size:1rem;cursor:pointer}
.dir-b .pill:hover{background:var(--accent-hover)}.dir-b .pill:active{opacity:.85}
.dir-b .pill.sm{min-height:32px;padding-inline:12px;font-size:.75rem;font-weight:400;position:relative}
.dir-b .pill.sm::after{content:"";position:absolute;inset:-6px -2px}
.dir-b .plain{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--accent);text-decoration:none;font-size:1.0625rem;background:none;border:0;padding:0;cursor:pointer}
.dir-b .plain:hover{text-decoration:underline}
.dir-b .plain .fa{font-size:.75em}
.dir-b .menu-btn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border:0;background:none;color:var(--text);cursor:pointer;font-size:1.0625rem}
.dir-b .hero{padding-block:56px 8px}
.dir-b h1{font-family:"Kufi","Plex Arabic",system-ui,sans-serif;font-weight:600;font-size:clamp(2rem,1.2rem + 3vw,3rem);line-height:1.15;max-width:22ch}
.dir-b .lede{font-size:clamp(1.125rem,1rem + .4vw,1.3125rem);color:var(--muted);max-width:36rem;margin-block:16px 0;line-height:1.5}
.dir-b .actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px;margin-block:28px 0}
.dir-b .sec{display:grid;grid-template-columns:1fr;gap:14px;padding-block:40px 36px;border-block-start:1px solid var(--hair)}
.dir-b .sec.first{border-block-start:0}
@media (min-width:860px){.dir-b .sec{grid-template-columns:216px minmax(0,1fr);gap:0 48px;padding-block:61px 56px}}
.dir-b .lab{font-family:"Kufi","Plex Arabic",system-ui,sans-serif;font-weight:600;font-size:1.5rem;line-height:1.17;scroll-margin-top:24px}
.dir-b .lab label{cursor:pointer}
.dir-b sup.fn a{font-size:.6em;text-decoration:none;color:var(--text);padding-inline:2px;margin-inline-start:2px}
.dir-b sup.fn a:hover{color:var(--accent)}
.dir-b .facts{min-width:0;color:var(--muted)}
.dir-b .facts strong,.dir-b .facts .d{color:var(--text);font-weight:600}
.dir-b .hint{margin-block:0 12px}
.dir-b .field{display:flex;align-items:center;gap:10px;min-height:48px;padding-inline:14px;border-radius:12px;background:var(--field);color:var(--text)}
.dir-b .field:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.dir-b .field input{flex:1;min-width:0;border:0;background:transparent;font-size:1.0625rem;min-height:46px;outline:none}
.dir-b .field .fa{color:var(--muted)}
.dir-b .chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-block:14px 0}
.dir-b .chip{min-height:44px;padding-inline:14px;border:1px solid var(--hair);border-radius:980px;background:transparent;cursor:pointer;font-size:.9375rem;color:var(--text)}
.dir-b .chip:hover{border-color:var(--muted)}.dir-b .chip[aria-pressed=true]{border-color:var(--text);font-weight:600}
.dir-b .res{margin-block-start:22px}
.dir-b .count{color:var(--text);font-weight:600;margin-block-end:6px}
.dir-b .line{display:flex;align-items:center;gap:10px;min-height:44px;text-decoration:none;color:var(--muted)}
.dir-b .line:hover .nm{color:var(--accent)}
.dir-b .line .flag{width:22px;height:16px;border-radius:2px}
.dir-b .line .nm{color:var(--text);font-weight:600}
.dir-b .line .oth{font-size:.875rem;color:var(--accent);font-weight:400}
.dir-b .line .dialw{margin-inline-start:auto}.dir-b .line .dial{font-size:.9375rem}
.dir-b .tag{font-size:.75rem;color:var(--muted);border:1px solid var(--hair);border-radius:980px;padding:0 8px;white-space:nowrap}
.dir-b .skel{display:flex;gap:10px;align-items:center;min-height:44px}
.dir-b .skel i{display:block;height:12px;border-radius:6px;background:var(--field)}
.dir-b .notice{color:var(--text);margin-block:14px 0}
.dir-b .figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 24px}
@media (min-width:860px){.dir-b .figs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.dir-b .fig b{display:block;font-family:"Kufi","Plex Arabic",system-ui,sans-serif;font-weight:600;font-size:clamp(2rem,1.5rem + 1.6vw,2.75rem);line-height:1.1;color:var(--text)}
.dir-b .fig span{display:block;margin-block-start:6px}
.dir-b .ways{display:grid;gap:22px}
.dir-b .ways .d{display:block}
.dir-b .url{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-block-start:8px}

const DIGITS = /[٠-٩۰-۹]/g;
const MARKS = /[ً-ٰٟـ]/g;

/** Arabic-Indic (٠-٩) and Persian (۰-۹) digits to Western (0-9). Nothing else changes. */
function westernDigits(text) {
    return text.replace(DIGITS, (d) => String(d.charCodeAt(0) & 0xf));
}
/** Folds a name or a query for matching: case, accents, Arabic letter variants, tashkeel, tatweel, «ال», punctuation. */
function normalize(text) {
    return westernDigits(text)
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "")
        .toLowerCase()
        .replace(MARKS, "")
        .replace(/[أإآٱةىؤئ]/g, (c) => LETTERS[c])

        .trim()
        .split(" ")
        .map((w) => (w.startsWith("ال") && w.length > 3 ? w.slice(2) : w))
        .join(" ");
}

/* ======================= Direction C ======================= */
const C = {
  shapeName(r) {
    if (st.build === "ar") return esc(r.name_ar);
    if (st.build === "en") return esc(r.name_en);
    return `${esc(nm(r))} <span class="oth"><bdi>${esc(oth(r))}</bdi></span>`;
  },
  json(r) {
    const o = st.build === "bilingual" ? { iso2: r.iso2, iso3: r.iso3, name_ar: r.name_ar, name_en: r.name_en } : { iso2: r.iso2, iso3: r.iso3, name: st.build === "ar" ? r.name_ar : r.name_en };
    return JSON.stringify(o, null, 2);
  },
  rows(m) {
    if (m.kind === "loading") return `<div class="tiles" aria-busy="true"><span class="sr">${t("search.loading.label")}</span>${"<div class=\"skel\"></div>".repeat(4)}</div>`;
    if (m.kind === "error") return errorBlock("btn");
    if (m.kind === "empty") return `${m.offline ? offlineLine() : ""}<div class="note"><p>${t("search.empty.body", { q: st.q.trim() })}</p><button type="button" class="lnk" style="border:0;background:none;padding:0;cursor:pointer" data-act="clear">${t("search.empty.action")}</button></div>`;
    const tiles = m.rows.map((r) => `<a class="tile" href="#countries">${flag(r.iso2)}${pinned(r) ? `<span class="tag">${t("search.region")}</span>` : ""}<span class="nm">${C.shapeName(r)}</span><span class="codes"><span>${r.iso2}</span><span>${esc(dials(r))}</span></span></a>`).join("");
    const extra = m.kind === "first" ? `<a class="tile all" href="#countries"><span>${t("search.list.all", { count: D.meta.countries })}</span></a>`
      : m.total > 8 && !st.all ? `<button type="button" class="tile all" data-act="all" style="border:1px dashed var(--hair);cursor:pointer;font:inherit"><span>${t("search.results.more", { n: m.total })}</span></button>` : "";
    const bar = `<div class="bar2" role="status"><span>${m.kind === "match" ? `<strong>${countLine(m)}</strong>` : ""}</span></div>`;
    return `${m.offline ? offlineLine() : ""}${m.kind === "match" ? bar : ""}<div class="tiles${m.kind === "first" ? "" : ""}" style="${m.kind === "first" ? "margin-block-start:18px" : ""}">${tiles}${extra}</div>${m.kind === "match" ? `<p class="src">${t("search.results.source")}</p>` : ""}`;
  },
  panel(m) {
    const r = (m.rows && m.rows[0]) || D.rows.find((x) => x.iso2 === (st.region || "SA"));
    const file = `data/modules/core${D.meta.builds[st.build === "bilingual" ? "bilingual" : st.build === "ar" ? "arabic" : "english"]}`;
    const opts = [["bilingual", "build.bilingual"], ["ar", "build.ar"], ["en", "build.en"]];
    return `<div class="ctl"><span class="lab" id="bl">${t("build.lang.label")}</span><div class="strip" role="radiogroup" aria-labelledby="bl">${opts.map(([v, k]) => `<button type="button" role="radio" aria-checked="${st.build === v}" data-build="${v}">${t(k)}</button>`).join("")}</div></div>
      <div><p class="path"><code>${esc(file)}</code></p><pre id="json">${esc(C.json(r))}</pre></div>`;
  },
  page() {
    const tl = [["install", "chrome.nav.install", "#install"], ["build", "chrome.nav.build", "#build"], ["countries", "chrome.nav.countries", "#countries"], ["agents", "chrome.nav.agents", "#agents"]];
    return `<a class="skip" href="#main">${t("chrome.skip-link")}</a>
<header class="hdr"><div class="wrap"><a class="wm" href="#top"><span class="dot" aria-hidden="true"></span>worldref</a><nav aria-label="${tt("chrome.menu.open")}">${tl.map(([, k, h]) => `<a class="tl" href="${h}">${t(k)}</a>`).join("")}<a class="iconbtn" href="${GH}" aria-label="${tt("footer.repo")}">${ic("github")}</a><button type="button" class="iconbtn menu-btn" data-act="menu" aria-haspopup="dialog" aria-expanded="${st.menu}" aria-label="${tt("chrome.menu.open")}">${ic("bars")}</button></nav></div></header>
<main id="main" tabindex="-1"><div class="wrap">
  <section class="hero" id="top" aria-labelledby="h1">
    <div><h1 id="h1">${t("home.hero.title")}</h1><p class="lede">${t("home.hero.body", { count: D.meta.countries })}</p></div>
    <div class="actions"><a class="btn pri" href="#install">${ic("terminal")}<span>${t("home.hero.install")}</span></a><a class="btn" href="#build">${ic("download")}<span>${t("home.hero.build")}</span></a></div>
  </section>
  <div class="inst">
    <aside class="panel" id="panel" aria-label="${tt("build.lang.label")}"></aside>
    <div class="search" role="search">
      <label for="q">${t("search.label")}</label>
      <p class="hint" id="qh">${t("search.hint")}</p>
      <div class="field">${ic("magnifying-glass")}<input id="q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search" aria-describedby="qh" aria-controls="results" value="${esc(st.q)}" dir="${qdir()}">${st.q ? `<button type="button" class="iconbtn" data-act="clear" aria-label="${tt("search.clear")}">${ic("xmark")}</button>` : `<span class="n" aria-hidden="true">${D.meta.countries}</span>`}</div>
      <div class="chips" id="chips">${chipsHtml()}</div>
      <div id="results" aria-live="polite"></div>
    </div>
  </div>
  <section class="s" aria-labelledby="numbers"><h2 class="t" id="numbers">${t("home.facts.title")}</h2>
    <div class="bento">
      <div class="cell big"><b>${num(D.meta.countries)}</b><span>${t("home.facts.rows")}<br>${t("home.facts.rows.split", { countries: D.kinds.country, territories: D.kinds.territory })}</span></div>
      <div class="cell"><b>${num(D.meta.subdivisions)}</b><span>${t("home.facts.subdivisions")}</span></div>
      <div class="cell"><b>${D.meta.modules.length}</b><span>${t("home.facts.modules")}</span></div>
      <div class="cell"><b>${Object.keys(D.meta.builds).length}</b><span>${t("home.facts.builds")}</span></div>
      <div class="cell"><b>${D.languages}</b><span>${t("home.facts.languages")}</span></div>
    </div>
    <p class="vline">${t("home.facts.version", { version: D.meta.version, cldr: D.meta.sources.cldr, phone: D.meta.sources.libphonenumber })}</p>
  </section>
  <section class="s" aria-labelledby="ways"><h2 class="t" id="ways">${t("home.ways.title")}</h2>
    <div class="ways">
      <a class="way" href="#install" id="install"><span class="ico">${ic("terminal")}</span><span class="grow"><strong>${t("home.ways.install.title")}</strong><p>${t("home.ways.install.body", { count: D.installRows })}</p></span></a>
      <a class="way" href="#build" id="build"><span class="ico">${ic("download")}</span><span class="grow"><strong>${t("home.ways.build.title")}</strong><p>${t("home.ways.build.body")}</p></span></a>
      <div class="way wide"><span class="ico">${ic("copy")}</span><span class="grow"><strong>${t("home.ways.api.title")}</strong><p>${t("home.ways.api.body")}</p><span class="urlrow"><code>${esc(apiUrl())}</code>${copyBtn("api", "btn")}</span>${copyErr("api")}</span></div>
      <a class="way wide" href="#agents" id="agents"><span class="ico">${ic("terminal")}</span><span class="grow"><strong>${t("home.ways.agents.title")}</strong><p>${t("home.ways.agents.body")}</p></span></a>
    </div>
  </section>
  <section class="s" aria-labelledby="native"><h2 class="t" id="native">${t("home.native.title")}</h2>
    <p style="color:var(--muted);margin-block-end:14px">${t("home.native.body")}</p>
    <div class="console">${nativeRows().map(([k, v]) => `<div class="r"><span class="k">${k}</span><span class="out">${v}</span></div>`).join("")}</div>
  </section>
  <section class="s" aria-labelledby="policy"><h2 class="t" id="policy">${t("policy.title")}</h2>
    <ul class="bul"><li>${t("policy.palestine")}</li><li>${t("policy.disputed")}</li><li>${t("policy.requests")}</li></ul>
    <a class="lnk" href="${policyUrl()}">${t("policy.full")} ${ic("arrow-right", "flip")}</a>
  </section>
  <section class="s" aria-labelledby="faq"><h2 class="t" id="faq">${t("faq.title")}</h2><div class="faq">${faq()}</div></section>
</div></main>
<footer class="foot"><div class="wrap"><div style="display:grid;gap:12px">${footLinks()}<p class="lic">${t("footer.licence-line")}</p></div>${switches()}</div></footer>`;
  },
};

/* ======================= shared pieces ======================= */
function nativeRows() {
  return [
    [t("home.native.search"), `<code>search(countries, "الامارات", "ar")[0].iso2</code> <code>"AE"</code>`],
    [t("home.native.nationality"), `<code>nationality_ar_m</code> سعودي، <code>nationality_ar_f</code> سعودية`],
    [t("home.native.digits"), `${t("home.native.digits.body")} ${t("home.native.digits.result", { number: { html: "<code>0501234567</code>" } })} <code>e164: "+966501234567", valid: true, mobile: true</code>`],
    [t("home.native.sort"), `${t("home.native.sort.value")} <code>sort_ar: "سعوديه"</code>`],
  ];
}
function faq() { return [1, 2, 3, 4, 5, 6].map((i) => `<details><summary><span>${t("faq.q" + i)}</span>${ic("chevron-right", "flip")}</summary><p>${t("faq.a" + i)}</p></details>`).join(""); }
function footLinks() {
  const nav = NAV.filter(([id]) => id !== "home").map(([, k, h]) => `<li><a href="${h}">${t(k)}</a></li>`).join("");
  return `<ul>${nav}<li><a href="${GH}">${ic("github")}<span>${t("footer.repo")}</span></a></li><li><a href="${GH}/issues">${t("footer.issues")}</a></li><li><a href="${GH}/tree/main/LICENSES">${t("footer.licences")}</a></li><li><a href="${GH}/blob/main/CITATION.cff">${t("footer.cite")}</a></li></ul>`;
}
function switches() {
  const langSeg = `<div class="seg" role="group" aria-labelledby="sl"><a href="?${qs({ lang: "ar" })}" lang="ar" data-lang="ar" aria-current="${st.lang === "ar"}">${W["switch.language.ar"][0]}</a><a href="?${qs({ lang: "en" })}" lang="en" data-lang="en" aria-current="${st.lang === "en"}">${W["switch.language.en"][1]}</a></div>`;
  const themeSeg = `<div class="seg" role="group" aria-labelledby="st">${["system", "light", "dark"].map((v) => `<button type="button" data-theme-set="${v}" aria-pressed="${st.theme === v}">${t("switch.theme." + v)}</button>`).join("")}</div>`;
  return `<div class="switches"><div><label id="sl">${t("switch.language.label")}</label>${langSeg}</div><div><label id="st">${t("switch.theme.label")}</label>${themeSeg}</div></div>`;
}
function copyBtn(id, cls) {
  const done = st.copied === id;
  const label = done ? t("action.copied-url") : t("action.copy-url");
  return `<button type="button" class="${cls}" data-copy="${id}" aria-live="polite">${ic(done ? "check" : "copy")}<span>${label}</span></button>`;
}
const copyErr = (id) => (st.copyErr === id ? `<p class="${st.dir === "b" ? "notice" : "note"}" role="alert">${t("action.copy.error")}</p>` : "");
function menuSheet() {
  return `<div class="sheet${st.menu ? " on" : ""}" id="sheet" role="dialog" aria-modal="true" aria-label="${tt("chrome.menu.open")}"${st.menu ? "" : " hidden"}><div class="in">
    <div class="top"><button type="button" class="${st.dir === "b" ? "menu-btn" : "iconbtn"}" style="display:inline-flex" id="sheetClose" data-act="close" aria-label="${tt("chrome.menu.close")}">${ic("xmark")}</button></div>
    <nav class="nav">${NAV.map(([, k, h]) => `<a href="${h}" data-act="close">${t(k)}${ic("chevron-right", "flip")}</a>`).join("")}</nav>${switches()}</div></div>`;
}
const qdir = () => (st.lang === "ar" && st.q && !/[؀-ۿ]/.test(st.q) ? "ltr" : st.lang === "ar" ? "rtl" : "ltr");
function qs(over) { const p = new URLSearchParams({ direction: st.dir, lang: st.lang, theme: st.theme, state: st.state, ...over }); return p.toString(); }
const R = { a: A, b: B, c: C };
const effTheme = () => (st.theme === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : st.theme);

/* ======================= render ======================= */
const site = document.getElementById("site");
function render() {
  const d = DIRS.find((x) => x.id === st.dir);
  site.className = "dir-" + st.dir;
  site.setAttribute("lang", st.lang);
  site.setAttribute("dir", st.lang === "ar" ? "rtl" : "ltr");
  site.dataset.theme = effTheme();
  document.documentElement.lang = st.lang;
  document.documentElement.dir = st.lang === "ar" ? "rtl" : "ltr";
  document.title = `${d.name} (${st.lang}, ${effTheme()}): worldref K4 directions`;
  const ribbon = `<div id="ribbon" title="Type: ${d.type}">${d.name}, seeded by ${d.seed}. U+20C1: <span class="riy" style="font-family:${d.fam.replace(/"/g, "'")}">&#x20C1; 1,250</span> (fallback system-ui). Tooling only.</div>`;
  site.innerHTML = ribbon + R[st.dir].page() + menuSheet();
  renderResults(false);
  tool();
  history.replaceState(null, "", "?" + qs({}));
  if (MISSING.length) console.warn("missing keys", [...new Set(MISSING)]);
}
function renderResults(animate) {
  const m = model();
  const box = document.getElementById("results");
  box.innerHTML = R[st.dir].rows(m);
  if (animate) { box.classList.remove("moment"); void box.offsetWidth; box.classList.add("moment"); }
  const chips = document.getElementById("chips"); if (chips) chips.innerHTML = chipsHtml();
  if (st.dir === "c") document.getElementById("panel").innerHTML = C.panel(m);
  const q = document.getElementById("q"); if (q) q.setAttribute("dir", qdir());
}
function setState(s) {
  st.state = s; st.all = false; st.copied = null; st.copyErr = null;
  st.q = SAMPLE[s] ? SAMPLE[s][st.lang] : "";
}
function tool() {
  const i = DIRS.findIndex((x) => x.id === st.dir);
  const d = DIRS[i];
  document.getElementById("tool").innerHTML = `<span class="note">Directions tooling, not part of the design</span>
    <span class="grp"><button type="button" data-tool="prev" aria-label="Previous direction">&larr; Prev</button><span class="name" aria-live="polite">${d.name}</span><button type="button" data-tool="next" aria-label="Next direction">Next &rarr;</button></span>
    <span class="grp" role="group" aria-label="Language">${["ar", "en"].map((l) => `<button type="button" data-tool-lang="${l}" aria-pressed="${st.lang === l}">${l.toUpperCase()}</button>`).join("")}</span>
    <span class="grp" role="group" aria-label="Theme">${["light", "dark"].map((v) => `<button type="button" data-tool-theme="${v}" aria-pressed="${effTheme() === v}">${v}</button>`).join("")}</span>
    <label class="grp">state <select data-tool-state>${STATES.map((s) => `<option${s === st.state ? " selected" : ""}>${s}</option>`).join("")}</select></label>`;
  site.style.paddingBlockEnd = document.getElementById("tool").offsetHeight + 24 + "px";
}
function cycle(n) { const i = DIRS.findIndex((x) => x.id === st.dir); st.dir = DIRS[(i + n + DIRS.length) % DIRS.length].id; st.menu = false; render(); }

document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-tool],[data-tool-lang],[data-tool-theme],[data-act],[data-chip],[data-copy],[data-theme-set],[data-lang],[data-build],a[href^='#']");
  if (!el) return;
  if (el.dataset.tool) return cycle(el.dataset.tool === "next" ? 1 : -1);
  if (el.dataset.toolLang || el.dataset.lang) { e.preventDefault(); st.lang = el.dataset.toolLang || el.dataset.lang; setState(st.state); st.menu = false; return render(); }
  if (el.dataset.toolTheme) { st.theme = el.dataset.toolTheme; return render(); }
  if (el.dataset.themeSet) { st.theme = el.dataset.themeSet; return render(); }
  if (el.dataset.build) { st.build = el.dataset.build; return renderResults(true); }
  if (el.dataset.chip !== undefined && el.dataset.chip !== "") { st.q = el.dataset.chip; st.all = false; if (st.state !== "offline") st.state = "first-run"; return renderAndKeep(); }
  if (el.dataset.copy) {
    const text = apiUrl();
    try { await navigator.clipboard.writeText(text); st.copied = el.dataset.copy; st.copyErr = null; render(); setTimeout(() => { if (st.copied === el.dataset.copy) { st.copied = null; render(); } }, 2000); }
    catch (err) { st.copyErr = el.dataset.copy; render(); const c = document.querySelector(".urlrow code, .url code"); if (c) { const r = document.createRange(); r.selectNodeContents(c); getSelection().removeAllRanges(); getSelection().addRange(r); } }
    return;
  }
  const act = el.dataset.act;
  if (act === "menu") { st.menu = true; render(); document.getElementById("sheetClose")?.focus(); return; }
  if (act === "close") { st.menu = false; render(); document.querySelector(".menu-btn")?.focus(); return; }
  if (act === "clear") { st.q = ""; st.all = false; if (st.state !== "offline") st.state = "first-run"; renderAndKeep(); document.getElementById("q")?.focus(); return; }
  if (act === "all") { st.all = true; return renderResults(true); }
  if (act === "retry") { st.state = "first-run"; return render(); }
  if (el.matches("a[href^='#']")) { const id = el.getAttribute("href").slice(1); const tgt = id && document.getElementById(id); if (!tgt) e.preventDefault(); }
});
function renderAndKeep() { const q = document.getElementById("q"); if (q) q.value = st.q; renderResults(true); }
document.addEventListener("input", (e) => {
  if (e.target.id === "q") { st.q = e.target.value; st.all = false; if (["empty", "partial", "success", "loading", "error"].includes(st.state)) st.state = "first-run"; renderResults(true); }
});
document.addEventListener("change", (e) => { if (e.target.matches("[data-tool-state]")) { setState(e.target.value); render(); } });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && st.menu) { st.menu = false; render(); document.querySelector(".menu-btn")?.focus(); return; }
  const a = document.activeElement;
  if (a && (a.matches("input,textarea,select") || a.isContentEditable)) return;
  if (e.key === "ArrowRight") cycle(1);
  if (e.key === "ArrowLeft") cycle(-1);
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (st.theme === "system") render(); });
new ResizeObserver(() => { site.style.paddingBlockEnd = document.getElementById("tool").offsetHeight + 24 + "px"; }).observe(document.getElementById("tool"));
setState(st.state);
render();
</script>
</body></html>
