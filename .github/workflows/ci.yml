name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_call:

jobs:
  data:
    name: Data and JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build && node scripts/docs.mjs
      - name: Generated files are committed and up to date
        run: git diff --exit-code
      - run: npm test
      - name: Site builds and passes the absence scan
        run: node site/build.mjs && node tests/site-scan.mjs

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.9" }
      - run: cd python && python -m unittest discover -s tests -v

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: swift test

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - run: cd kotlin && ./gradlew test publishToMavenLocal

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - run: cd dart && dart pub get && dart analyze && dart test

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.1", extensions: intl, mbstring }
      - run: composer validate --strict && php php/tests/run.php

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.21" }
      - run: cd go && go vet ./... && go test ./...

  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: "8.0.x" }
      - run: cd csharp && dotnet test

  mcp:
    name: MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Initialize, list tools, call a tool
        run: |
          out=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_country","arguments":{"iso2":"sa"}}}' | node mcp/cli.js mcp)
          echo "$out" | grep -q '"serverInfo"' && echo "$out" | grep -q 'validate_phone' && echo "$out" | grep -q 'السعودية'
