name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_call:

jobs:
  data:
    name: Data and JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund # fails when package-lock.json is out of date
      - run: npm run build && node scripts/docs.mjs
      - name: Generated files are committed and up to date
        run: git diff --exit-code
      - run: npm test
      - name: Site builds and passes the absence scan
        run: node site/build.mjs && node tests/site-scan.mjs

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.9" }
      - run: cd python && python -m unittest discover -s tests -v

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: swift test

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - run: cd kotlin && ./gradlew test publishToMavenLocal

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - run: cd dart && dart pub get && dart analyze && dart test

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.1", extensions: intl, mbstring }
      - run: composer validate --strict && php php/tests/run.php

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.21" }
      - run: cd go && go vet ./... && go test ./...

  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: "8.0.x" }
      - run: cd csharp && dotnet test

  node-min:
    name: JavaScript and MCP server on the minimum Node (20.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "20.10.0" }
      - run: node --test tests/js.test.mjs tests/mcp.test.mjs
