# Publishes a release to the package registries. Each registry is off until its repository variable is set
# to "true" (Settings > Secrets and variables > Actions > Variables), after its account is linked.
# Tokenless where the registry supports it (OIDC trusted publishing): npm, PyPI, NuGet, MCP Registry.
# Maven Central has no OIDC publishing: it uses a portal token and a signing key, kept as repository secrets.
name: Publish
on:
  release: { types: [published] }
  workflow_call:
  workflow_dispatch:

permissions: { contents: read, id-token: write }

jobs:
  npm:
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      - name: Publish unless this version is already on npm
        run: |
          v=$(node -p 'require("./package.json").version')
          if npm view "worldref@$v" version >/dev/null 2>&1; then echo "worldref@$v already on npm"; else npm install -g npm@latest && npm publish --access public; fi

  mcp-registry:
    # Runs after npm when npm publishes, or on its own when npm is off (the package already exists there).
    needs: npm
    if: always() && vars.PUBLISH_MCP == 'true' && needs.npm.result != 'failure'
    runs-on: ubuntu-latest
    env: { MCP_PUBLISHER_VERSION: v1.8.7 }
    steps:
      - uses: actions/checkout@v5
      - run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          v=$(jq -r .version server.json)
          if curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.arj-89/worldref" | jq -e --arg v "$v" '.servers[] | select(.server.version == $v)' >/dev/null; then echo "MCP Registry already has $v"; exit 0; fi
          # The registry validates against npm, which can take a minute to list a new version.
          for i in $(seq 20); do npm view "worldref@$v" version >/dev/null 2>&1 && break; sleep 15; done
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  pypi:
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install build && python -m build python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: python/dist, skip-existing: true }

  nuget:
    if: vars.PUBLISH_NUGET == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: "8.0.x" }
      - run: dotnet pack csharp/WorldRef/WorldRef.csproj -c Release -o out
      - uses: NuGet/login@v1
        id: login
        with: { user: arj89 }
      - run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  maven-central:
    if: vars.PUBLISH_MAVEN == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - name: Publish unless this version is already on Maven Central
        working-directory: kotlin
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)
          if curl -fsSI "https://repo1.maven.org/maven2/io/github/arj-89/worldref/$v/worldref-$v.pom" >/dev/null; then echo "worldref $v already on Maven Central"; exit 0; fi
          ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
