# Refreshes upstream data. Monthly: CLDR, libphonenumber, IANA, Google address data, Wikidata, Factbook archive.
# Quarterly: World Bank population. Releases a patch when the data changed and every suite passes;
# opens an issue when something fails.
name: Upkeep
on:
  schedule:
    - cron: "0 3 1 * *"        # monthly
    - cron: "0 4 1 1,4,7,10 *" # quarterly population
  workflow_dispatch:
    inputs:
      sources: { description: "fetch.mjs jobs (empty = monthly set)", required: false }

permissions: { contents: write, issues: write }

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs: { changed: "${{ steps.diff.outputs.changed }}" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Fetch
        run: |
          if [ "${{ github.event.schedule }}" = "0 4 1 1,4,7,10 *" ]; then node scripts/fetch.mjs population;
          elif [ -n "${{ inputs.sources }}" ]; then node scripts/fetch.mjs ${{ inputs.sources }};
          else node scripts/fetch.mjs wikidata phone timezones address subdivisions factbook; fi
      - run: npm run build && node scripts/docs.mjs && npm test
      - id: diff
        run: git diff --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.diff.outputs.changed == 'true'
        with: { name: refreshed, path: ".", include-hidden-files: true }

  test:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    needs: [refresh, test]
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Refetch the same sources, bump patch, commit, tag
        run: |
          if [ "${{ github.event.schedule }}" = "0 4 1 1,4,7,10 *" ]; then node scripts/fetch.mjs population;
          elif [ -n "${{ inputs.sources }}" ]; then node scripts/fetch.mjs ${{ inputs.sources }};
          else node scripts/fetch.mjs wikidata phone timezones address subdivisions factbook; fi
          node scripts/release.mjs patch
          v=$(node -p 'require("./package.json").version')
          git config user.name "worldref-bot" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -m "Data refresh v$v"
          git tag "v$v" && git tag "go/v$v"
          git push origin HEAD --tags
          gh release create "v$v" --generate-notes --title "v$v (data refresh)"
        env: { GH_TOKEN: "${{ github.token }}" }

  report:
    needs: [refresh, test]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh issue create -R "$GITHUB_REPOSITORY" --title "Upkeep failed $(date +%F)" \
            --body "The scheduled refresh failed a gate. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env: { GH_TOKEN: "${{ github.token }}" }
